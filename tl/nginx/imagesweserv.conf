# Original file:
# https://github.com/weserv/images/blob/5.x/ngx_conf/imagesweserv.conf

# TL overrides
# https://github.com/weserv/images/tree/5.x/ngx_conf
weserv_process_timeout 95s; # Cloudflare proxy timeout is 100 sec
weserv_max_size 300m;
weserv_limit_input_pages 0;
weserv_limit_input_pixels 0;
weserv_limit_output_pixels 0;
weserv_savers jpg png webp json gif;

# ?url= allowlist (SSRF protection). Tested by tests/run.sh
include url-allowlist.conf;

# Extract IPFS CID out of ?url= param, for use as a Cloudflare cache tag.
# CIDs are alphanumeric so this matches whether or not the url is percent-encoded,
# and covers both path gateways (ipfs.io/ipfs/<cid>/1.png) and subdomain
# gateways (<cid>.ipfs.w3s.link/1.png), plus bare ipfs://<cid> urls.
map $arg_url $url_ipfs_cid {
    default "";
    "~(Qm[1-9A-HJ-NP-Za-km-z]{44})"  $1;  # CIDv0 (base58btc)
    "~(ba[a-z2-7]{57,})"             $1;  # CIDv1 (base32, lowercase)
}

# In memory cache:
# Please adjust cache size (max_size=250m) to a value that you can accommodate in RAM! Advised values: 2 GB RAM: 500m, 4 GB RAM: 1g, 8 GB RAM: 2g, etc..
# proxy_cache_path /dev/shm/proxy_cache inactive=8h levels=1:2 keys_zone=images:512m max_size=500m loader_files=5000 use_temp_path=off;

# Disk cache: grows to fill disk but ensures 16GB space free, caches resized images up to 1 year
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=images:64m min_free=16g inactive=1y loader_files=1000 use_temp_path=off;

proxy_cache_min_uses 1;
proxy_read_timeout 95s;
proxy_send_timeout 95s;
proxy_buffers 256 8k;
proxy_buffering on;

# Enable proxy cache lock to make sure we only process the same url request once at a time.
proxy_cache_lock on;
proxy_cache_lock_age 95s;
proxy_cache_lock_timeout 95s;

upstream images {
    server 127.0.0.1:80;

    # a pool with at most 200 connections
    keepalive 200;
}

server {
    listen 80;

    server_name images.weserv.local;

    access_log off;
    error_log /var/log/nginx/weserv-local-error.log;

    root /var/www/imagesweserv/public;
    absolute_redirect off;

    error_page 404 /404.html;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        # Use Docker's embedded DNS server instead.
        # see https://github.com/weserv/images/issues/206#issuecomment-1752740666
#         resolver 127.0.0.11;

        resolver 1.1.1.1 1.0.0.1 ipv6=off; # Use Cloudflare's open DNS server

        weserv proxy;

        # General Cache-Control to successful responses
        add_header Cache-Control "max-age=31536000, public, immutable";

        # Allow only certain domains from linking to scaler
        valid_referers none blocked server_names
            localhost
            *.transient.xyz
            *.transient.fun
            *.transientlabs.xyz
            *.postino.ai
            *.deeple.xyz
            *.regularanimals.ai
            *.deptofdeath.xyz
            *.burds.xyz
            *.alwayshasbeen.xyz
            *.nofuckingidea.wtf
            *.glifs.art
            *.artforhumans.xyz
            windows.davekrugman.com
            oracles.adamtastic.com
            ~([\w-]+)-transient-labs\.vercel\.app;

        if ($invalid_referer) {
            # Prevent caching of 403 responses
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            return 403 "Invalid referrer";
        }

        # To debug domain whitelisting logic:
        # add_header X-debug-url-domain $url_domain always;
        # add_header X-debug-url-whitelisted $is_domain_whitelisted always;

        if ($request_allowed = 0) {
            # Prevent caching of 400 responses
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            return 400 "Invalid url domain";
        }

        if ($default_param_present) {
            # Prevent caching of 400 responses
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            return 400 "default param not supported";
        }
    }

    location /static/ {
        weserv filter;
        alias /var/www/imagesweserv/public/;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;

    server_name _;

    access_log /var/log/nginx/weserv-access.log main buffer=4096 flush=5m;
    access_log /var/log/nginx/weserv-stats.log stats buffer=4096 flush=5m;
    error_log /var/log/nginx/weserv-error.log;

    root /var/www/imagesweserv/public;

    add_header Last-Modified '' always; # Always remove the Last-Modified header
    add_header Cross-Origin-Resource-Policy 'cross-origin' always; # CORS
    add_header Access-Control-Allow-Origin '*' always; # CORS
    add_header Timing-Allow-Origin '*' always;
    add_header X-Cache-Status $upstream_cache_status;

    # Cloudflare cache tag so responses can be purged by IPFS CID.
    # Not added when $url_ipfs_cid is empty (nginx skips add_header with an empty value).
    add_header Cache-Tag $url_ipfs_cid always;

    location / {
        expires 1y; # Far-future expiration for static files
        try_files $uri $uri.html$is_args @proxy;
    }

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 '{"status":"ok"}';
    }

    location = /clear-cache/ {
        return 301 /clear-cache;
    }

    location = /clear-cache {
        default_type application/json;
        add_header Cache-Control 'no-store, must-revalidate';
        add_header Clear-Site-Data '"cache", "storage"';
        return 200 '{"status":"success", "code":200, "message":"Browser cache successfully cleared!"}';
    }

    location @proxy {
        proxy_cache images;
        proxy_cache_key '$request_method|wsrv.nl|$request_uri';
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_cache_valid 200 301 410 1y;
        proxy_cache_valid 404 5s;
        proxy_cache_valid 400 403 429 500 502 503 504 0;
        proxy_cache_valid any 5m;
        proxy_cache_use_stale error timeout updating;

        proxy_pass http://images;
        proxy_set_header Host images.weserv.local;
        proxy_set_header X-Original-Host $http_host;
        proxy_set_header X-Original-Scheme $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Enable the upstream persistent connection
        proxy_http_version 1.1;
        proxy_set_header Connection '';

    }
}
