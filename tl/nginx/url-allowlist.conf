# Extract the host out of the ?url= param, by construction: only a canonically
# shaped http(s) URL yields a host, and the host can only ever be plain hostname
# characters ([a-z0-9.-]). The scheme may be literal (https://) or percent-
# encoded (https%3A%2F%2F), and the authority must end at a path separator -
# literal '/', encoded '%2f', or end of string. Anything else (a port, '%3A',
# userinfo '@', protocol-relative //host, backslashes) fails to match and falls
# back to "" -> rejected by the gate below. This removes the need to separately
# hunt for ports / smuggled encoding in the authority.
map $arg_url $url_domain {
    default "";
    "~*^https?://([a-z0-9.-]+)(?:/|%2f|$)"       $1;
    "~*^https?%3a%2f%2f([a-z0-9.-]+)(?:/|%2f|$)" $1;
}

# Is a `url` param actually present? Used to tell "no url param" apart from
# "url param present but unparseable" (e.g. a protocol-relative //evil.com,
# which the $url_domain regex above fails to match and falls back to "").
# Both yield an empty $url_domain, but only the former should be allowed.
map $arg_url $url_present {
    default 1;
    ""      0;
}

# Validate that image url to transform in is from one of our whitelisted domains
map $url_domain $is_domain_whitelisted {
    hostnames;
    default 0;

    ipfs.io 1;
    ipfs.filebase.io 1;
    .arweave.net 1;
    .w3s.link 1;
    .transient.xyz 1;
    .transientlabs.xyz 1;
    .transientusercontent.xyz 1;
    .transient.fun 1;
    transientlabs.b-cdn.net 1;
    gateway.pinata.cloud 1;
    images.ctfassets.net 1;
    downloads.ctfassets.net 1;
    d1em0p0on69a7q.cloudfront.net 1;
    d1gcjfo1kiqro6.cloudfront.net 1;
    d30s1qed0iad4q.cloudfront.net 1;
    dv0xp0uwyoh8r.cloudfront.net 1;
    services-testing.s3.filebase.com 1;
    deeple-prod.s3.us-east-1.amazonaws.com 1;
    storage.googleapis.com 1;
    pbs.twimg.com 1;
    ipfs.pixura.io 1;
    nft2-cdn.alchemy.com 1;
    .seadn.io 1;
}

# Final gate: allow only when there is no url param at all (homepage/static),
# or when a present url yielded a whitelisted host above. A malformed url (port,
# smuggled encoding, userinfo, protocol-relative, ...) yields an empty host and
# is rejected here, same as a host that is simply not in the allowlist.
map "$url_present:$is_domain_whitelisted" $request_allowed {
    default 0;
    "0:0" 1; # no url param -> fine
    "1:1" 1; # url present and host in allowlist
}

# Reject the ?default= fallback-image param (and its legacy alias
# ?errorredirect=): weserv answers it with a 302 to an arbitrary URL, i.e. an
# open redirect. Matched on the raw query string rather than $arg_default so a
# duplicated (?default=&default=...) or value-less param can't slip past. Also
# reject any param name containing percent-encoding (e.g. d%65fault=) - no
# legitimate param needs it, and it closes off encoded-name smuggling.
map $args $default_param_present {
    default 0;
    "~*(?:^|&)(?:default|errorredirect)(?:=|&|$)" 1;
    "~(?:^|&)[^=&]*%"                             1;
}
