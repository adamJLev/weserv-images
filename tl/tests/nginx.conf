# Minimal nginx that applies the real allowlist + default-param gates, mirroring imagesweserv.conf:
# 200 when the request is allowed, 400 when it is rejected.
events {}
http {
    access_log off;
    include /repo/tl/nginx/url-allowlist.conf;

    server {
        listen 80;
        location / {
            if ($request_allowed = 0) {
                return 400 "Invalid url domain";
            }
            if ($default_param_present) {
                return 400 "default param not supported";
            }
            return 200 "OK";
        }
    }
}
